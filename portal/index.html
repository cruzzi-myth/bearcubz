    <script>
      // GitHub Pages SPA fallback (part 2 of 2 — part 1 is the
      // redirect in /404.html at the repo root, which sends deep
      // links here as /portal/?p=/dashboard). Restore the real URL
      // BEFORE React Router mounts and reads it, so a hard refresh or
      // a direct deep link lands on the right page instead of always
      // showing the Portal entrance.
      //
      // This is an independent copy of the same mechanism the Moon
      // Racer Universe app uses for /universe/ — see that app's
      // index.html and the matching block in /404.html before
      // touching either one.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var deepPath = params.get('p');
        if (deepPath) {
          var restored = '/portal' + deepPath + window.location.hash;
          window.history.replaceState(null, '', restored);
        }
      })();
    </script>
    <script type="module" crossorigin src="/portal/assets/index-DO_GR1Nr.js"></script>
